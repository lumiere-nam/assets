<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니멀리스트 모노크롬 설문지</title>
  
  <!-- 모바일 가독성을 극대화하는 폰트 조합 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* 기본 리셋 및 모노크롬 테마 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f2f2f2;
      color: #111;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-bodoni { font-family: 'Bodoni Moda', serif; }
    
    /* 모바일 화면에 최적화된 컨테이너 (최대 너비 고정) */
    .survey-container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 30px rgba(0,0,0,0.05);
    }
    
    /* 헤더 이미지 (여백 없이 꽉 채움) */
    .hero-img {
      width: 100%;
      height: auto;
      display: block;
      /* 흑백 느낌을 더 강하게 */
      filter: grayscale(100%) contrast(1.05);
    }
    
    /* 본문 여백 (모바일에서 숨통이 트이도록 넉넉하게) */
    .content-wrapper {
      padding: 35px 24px 50px 24px;
    }
    
    /* 절제된 제목 디자인 */
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 35px;
      letter-spacing: -0.03em;
      border-bottom: 2px solid #000;
      padding-bottom: 20px;
    }
    
    /* 소리내어 읽기 버튼 (선과 여백만으로 디자인) */
    .btn-outline {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-outline:active { background: #f0f0f0; }
    
    /* 안내글 박스 (색상을 빼고 선과 배경색만으로 깔끔하게) */
    .intro-box {
      background: #f8f8f8;
      border-left: 3px solid #000000;
      padding: 24px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #333333;
      margin-bottom: 40px;
    }
    .intro-box p { margin-bottom: 12px; }
    .intro-box ul { padding-left: 20px; margin-bottom: 16px; }
    .intro-box li { margin-bottom: 8px; }
    
    /* 시작 버튼 (가장 눈에 띄는 완전 블랙 솔리드 버튼) */
    .btn-solid {
      display: block;
      width: 100%;
      padding: 20px;
      background: #000000;
      color: #ffffff;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .btn-solid:active { background: #333333; }
  </style>
</head>
<body>

  <div class="survey-container">
    <!-- 헤더 이미지 -->
    <img src="https://raw.githubusercontent.com/lumiere-nam/assets/main/images/Black%20White%20Minimalist%20Model%20Agency%20Presentation.jpg" class="hero-img">
    
    <div class="content-wrapper">
      <!-- 텍스트 굵기로 강약을 조절한 제목 -->
      <h1>이미지스타일성향테스트 <span style="font-weight:300; color:#555;">(사전)</span></h1>
      
      <!-- 주황색을 버리고 세련된 흑백 라인 버튼으로 변경 -->
      <button class="btn-outline">
        <span style="margin-right:10px;">🔊</span> 안내글 소리내어 읽기
      </button>
      
      <!-- 노란 배경과 주황 테두리를 버린 모던한 안내 박스 -->
      <div class="intro-box">
        <p>안녕하세요.</p>
        <p>"입을 옷이 없다"는 말, 사실은 옷장 앞에서 오늘의 나를 찾지 못하고 있다는 신호입니다. 이 설문은 협회의 이미지스타일 방법론을 바탕으로, 여러분의 현재 스타일과 내면 상태를 알아보기 위해 마련했습니다.</p>
        <ul>
          <li><strong>소요 시간:</strong> 약 1~2분 (총 8개 문항)</li>
          <li>응답은 익명으로 처리되어 연구 목적으로만 소중하게 사용됩니다.</li>
        </ul>
        <p style="margin-bottom:0;">정답을 찾는 설문이 아니니, 부담 갖지 말고 지금의 나를 편안하게 들여다봐 주세요.</p>
        
        <!-- 협회 로고 역할을 하는 영문 타이포그래피 (Bodoni) -->
        <div style="text-align:right; margin-top:25px; font-weight:700; font-size:1.1rem; letter-spacing:0.1em;" class="font-bodoni">
          KFTA
        </div>
      </div>
      
      <!-- 둥근 파란색 버튼을 버리고, 시크하고 강렬한 블랙 솔리드 버튼으로 변경 -->
      <button class="btn-solid">설문 시작하기</button>
    </div>
  </div>

</body>
</html>
