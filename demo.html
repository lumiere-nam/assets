<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크리에이티브 디자인 데모</title>
  
  <!-- 1. Tailwind CSS (세련된 레이아웃과 색상, 그림자 등) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. Animate.css (크리에이티브 애니메이션) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <!-- 메인 카드 (Tailwind로 예쁜 그림자, 둥근 모서리 적용 / Animate로 스르륵 올라오는 효과) -->
  <div class="bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] max-w-lg w-full p-10 text-center animate__animated animate__fadeInUp">
    
    <!-- 뱃지 (Animate로 통통 튀며 나타남, 1초 지연) -->
    <div class="inline-block bg-blue-100 text-blue-600 font-bold px-4 py-1.5 rounded-full mb-6 text-sm animate__animated animate__bounceIn animate__delay-1s">
      ✨ 디자인 스킬 데모
    </div>

    <!-- 제목 -->
    <h1 class="text-3xl font-extrabold text-gray-800 mb-4 tracking-tight">
      Tailwind <span class="text-blue-500">+</span> Animate
    </h1>

    <!-- 설명 텍스트 -->
    <p class="text-gray-500 mb-10 leading-relaxed text-lg">
      테일윈드(Tailwind)의 부드러운 입체감과 세련된 색상, 그리고 애니메이트(Animate.css)의 역동적인 생동감을 결합한 화면입니다.
    </p>

    <!-- 버튼 (Tailwind로 그라데이션 및 마우스 오버 시 살짝 떠오르는 효과 / Animate로 심장처럼 계속 뛰는 효과) -->
    <button class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold text-lg py-4 px-8 rounded-2xl shadow-lg transition-transform transform hover:-translate-y-1 hover:shadow-2xl animate__animated animate__pulse animate__infinite">
      가만히 둬도 뛰는 버튼!
    </button>
    
  </div>

</body>
</html>
